# ~/.config/solar_sonar/settings.toml
# Settings

# Where EVE stores your chat log files.
# Enable logging: EVE > Settings > Chat > Log Chat to File
# Enable timestamps: Right-click on channel > Show Timestamp
# 
## Common locations
# Linux (Steam, Debian): "~/.steam/debian-installation/steamapps/compatdata/8500/pfx/drive_c/users/steamuser/Documents/EVE/logs"
# MacOS (Standalone): "~/Documents/EVE/logs"
logs_dir = "~/Documents/EVE/logs"
