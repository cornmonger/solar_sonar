# ~/.config/solar_sonar/channels.toml
# Log file configuration 

## Modes
# The user-defined context for a configuration profile.
# Defined in ~/.config/solar_sonar/settings.toml
# 
## Kind
# - alliance
# - corporation
# - fleet
# - group
# - game 
# - local
# 
## Analysis 
# Employs parsers and audible pings for them.  
# Certain analyzers run regardless, depending on log kind. 
# 
# - combat: Incoming attacks
# - callout: Chat messages indicating danger
# - intel: Structured intel broadcats ("<SYSTEM> [keyword] <content>")
# - message: Messages directed at you
# 
## Name
# The name of the chat channel. Applicable to 'group' kind only

[[log]]
kind = "group"
name = "our.intel"
modes = ["stand", "crab"]
characters = ["me"]
pings = ["intel"]

[[log]]
kind = "fleet"
modes = ["crab"]
characters = ["me"]
pings = ["callout", "message"]

[[log]]
kind = "fleet"
modes = ["stand"]
characters = ["me"]
pings = ["combat", "message"]

[[log]]
kind = "game"
modes = ["crab"]
characters = ["me"]
pings = ["callout"]
